# Reproducible deployment: MySQL 8.4 loaded with the schema, plus the FastAPI app.
#
#   docker compose up -d --build
#   open http://localhost:8000
#
# The database is built from 00_build_everything.sql on first start.

services:
  db:
    image: mysql:8.4
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${DB_NAME:-travel_itinerary_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./00_build_everything.sql:/docker-entrypoint-initdb.d/00_build_everything.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-p${DB_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpw}
      DB_NAME: ${DB_NAME:-travel_itinerary_db}
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env before starting}
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
